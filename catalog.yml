# Every jar rcmd knows how to fetch.
#
# kind decides where the file lands: an engine becomes server.jar, a
# plugin goes in plugins/ and a mod goes in mods/.
#
# file_filter picks one file out of a release that ships several, and
# archive_filter picks one out of a zip. In both, * is the only
# wildcard and everything else is literal.

artifacts:
  - name: 'alternatecurrent'
    kind: mod
    source: modrinth
    url: 'https://modrinth.com/mod/alternate-current/'
    file_filter: 'alternate-current-mc26.2-*.jar'
    post_processors: [fabric_mod]

  - name: 'AntiRedstoneClock'
    kind: plugin
    source: github
    url: 'https://github.com/OneLiteFeatherNET/AntiRedstoneClock-Remastered'
    file_filter: 'AntiRedstoneClock-Remastered-*.jar'
    post_processors: [plugin]

  - name: 'AntiXray'
    kind: mod
    source: modrinth
    url: 'https://modrinth.com/mod/anti-xray/'
    file_filter: 'antixray-fabric-*26.*.jar'
    post_processors: [fabric_mod]

  - name: 'BlueMap'
    kind: engine
    source: github
    url: 'https://github.com/BlueMap-Minecraft/BlueMap'
    file_filter: 'bluemap-*-cli.jar'

  - name: 'BungeeTabListPlus'
