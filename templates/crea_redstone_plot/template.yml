inherits: crea_common

artifacts:
  Purpur: '26.2'
  RedCraftRedstoneUtility: '0.0.*'

# The literal string sitting in the config files, mapped onto
# the environment variable holding the real value on the
# machine doing the build. No secret is ever in here.
secrets:
  MYSQL_PASSWORD: COMMON_MYSQL_PASSWORD
  SCHEMATIO_PLUGIN_API_TOKEN: SCHEMATIO_PLUGIN_API_TOKEN
  SENTRY_DSN_CREA_REDSTONE_PLOT: SENTRY_DSN_CREA_REDSTONE_PLOT
  VELOCITY_FORWARDING_SECRET: VELOCITY_FORWARDING_SECRET
